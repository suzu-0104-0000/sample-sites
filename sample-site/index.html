<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Sites</title>
  <meta name="description" content="提案用サンプルサイトの公開ルートです。">
  <style>
    :root {
      --bg: #f4efe7;
      --surface: rgba(255, 248, 239, 0.92);
      --line: rgba(12, 36, 62, 0.12);
      --text: #152033;
      --muted: #5d6778;
      --navy: #11243a;
      --orange: #f97316;
      --shadow: 0 20px 45px rgba(17, 36, 58, 0.12);
      --container: min(960px, calc(100% - 40px));
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: var(--text);
      line-height: 1.7;
      background:
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.18), transparent 25%),
        linear-gradient(180deg, #fbf7f1 0%, var(--bg) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: var(--container);
      margin: 0 auto;
    }

    .hero {
      padding: 80px 0;
    }

    .panel {
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 26px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      font-weight: 700;
      transition: transform 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      background: linear-gradient(135deg, var(--orange) 0%, #ff8f3d 100%);
      color: #fff;
      box-shadow: 0 14px 28px rgba(249, 115, 22, 0.28);
    }

    .button-secondary {
      background: rgba(17, 36, 58, 0.08);
      color: var(--navy);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="hero">
    <div class="container">
      <section class="panel">
        <p class="eyebrow">Sample Sites</p>
        <h1>提案用サンプルサイトの公開ルート</h1>
        <p>
          このトップページは公開用の入口です。サンプルの一覧管理ページは `/portal/` に分離しており、
          BASIC 認証を通した場合のみ閲覧できる構成にしています。
        </p>
        <div class="actions">
          <a class="button button-primary" href="portal/">管理ポータルへ</a>
          <a class="button button-secondary" href="basketball-association/">公開サンプルを見る</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
